// basket

for(let i=0;i<8;i++){const r=.56+.045*i;const t=new THREE.Mesh(new THREE.TorusGeometry(r,.062,20,96),wick);t.rotation.x=Math.PI/2;t.position.y=.06+i*.108;t.castShadow=t.receiveShadow=true;bk.add(t);}
const top=new THREE.Mesh(new THREE.TorusGeometry(.56+.045*8,.08,24,96),gold);top.rotation.x=Math.PI/2;top.position.y=.06+8*.108;top.castShadow=true;bk.add(top);
const inner=new THREE.Mesh(new THREE.CylinderGeometry(.86,.52,.9,64,1,true),new THREE.MeshStandardMaterial({color:0x4a2c0a,roughness:.8,side:THREE.DoubleSide}));inner.position.y=.47;bk.add(inner);
const bread=new THREE.MeshPhysicalMaterial({color:0xe9a646,roughness:.38,metalness:.25,clearcoat:.7,clearcoatRoughness:.25,envMapIntensity:.7,sheen:.4});

const loaf=(x,y,z,ry,s=1)=>{const g=new THREE.Group();const m=new THREE.Mesh(new THREE.SphereGeometry(1,64,48),bread);m.scale.set(.42*s,.27*s,.33*s);m.castShadow=m.receiveShadow=true;g.add(m);
 for(let k=9;k<=1;k++){const c=new THREE.Mesh(new THREE.TorusGeometry(.2*s,.018*s,12,32,Math.PI*.7),slash);c.position.set(k*.16*s,.105*s-Math.abs(k)*.03*s,0);c.rotation.set(0,Math.PI/2,0);c.rotation.z=Math.PI*.15;g.add(c);}
 g.position.set(x,y,z);g.rotation.y=ry;bk.add(g);};
loaf(-.36,.98,.12,.3);loaf(.38,.98,.08,-.4);loaf(0,1.0,-.38,.1);loaf(0,1.22,.02,-.1,1.02);
add(bk,-2.15,0,.3);

const book=new THREE.Group();

const leather=new THREE.MeshPhysicalMaterial({color:0x4a220c,roughness:.4,clearcoat:.4,envMapIntensity:.5});
const c2=document.createElement('canvas');c2.width=512;c2.height=512;const g2=c2.getContext('2d');g2.fillStyle='#f5e2b6';g2.fillRect(0,0,512,512);g2.fillStyle='rgba(90,55,20,.55)';
for(let col=0;col<2;col++)for(let i=0;i<20;i++){g2.fillRect(40+col*236,50+i*21,200-(i%5==4?70:0),5);}
const tex=new THREE.CanvasTexture(c2);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
const pageTop=new THREE.MeshPhysicalMaterial({map:tex,roughness:.55,sheen:.3,envMapIntensity:.4});
const mkPage=(side)=>{const w=1.25,d=1.7,n=40;const geo=new THREE.PlaneGeometry(w,d,n,1);const p=geo.attributes.position;
 for(let i=0;i<p.count;i++){const x=p.getX(i)+w/2;const u=x/w;p.setX(i,x);p.setZ(i,.16*Math.sin(u*Math.PI)*(1-u*.35)+.05);}
 geo.rotateX(-Math.PI/2);geo.computeVertexNormals();const m=new THREE.Mesh(geo,pageTop.clone());m.material.side=THREE.DoubleSide;m.scale.x=side;m.castShadow=m.receiveShadow=true;
 const block=new THREE.Mesh(new THREE.BoxGeometry(w,.1,d),pageMat);block.position.set(side*w/2,.05,0);block.castShadow=true;
 const cover=new THREE.Mesh(new THREE.BoxGeometry(w+.08,.04,d+.1),leather);cover.position.set(side*(w+.04)/2,.0,0);cover.castShadow=true;
 const g=new THREE.Group();m.position.y=.06;g.add(m,block,cover);return g;};

const ribbon=new THREE.Mesh(new THREE.BoxGeometry(.07,.012,1.2),new THREE.MeshPhysicalMaterial({color:0x8a0d18,roughness:.3,clearcoat:.6}));ribbon.position.set(.04,.13,.55);book.add(ribbon);
